# PostgreSQL 16 pour Diguee (ticket #7), dans
# /etc/postgresql/16/main/conf.d/diguee.conf.
#
# Aucun port TCP : le serveur et les migrations passent par le socket Unix
# local (/var/run/postgresql), avec l'authentification « peer ». C'est plus
# strict qu'une écoute sur la boucle locale : rien n'écoute sur le réseau.
listen_addresses = ''
password_encryption = 'scram-sha-256'

# Journaux : vers journald (14 jours), sans adresse, sans requête, sans
# paramètre, sans détail (le détail d'une violation d'unicité citerait une
# empreinte).
log_destination = 'syslog'
syslog_ident = 'postgresql'
logging_collector = off
log_connections = off
log_disconnections = off
log_hostname = off
log_line_prefix = '[%p] '
log_statement = 'none'
log_min_error_statement = 'panic'
log_min_duration_statement = -1
log_error_verbosity = 'terse'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_checkpoints = off
log_autovacuum_min_duration = -1
