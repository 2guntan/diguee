# SSH par clé uniquement (spec §11, ticket #7). Placé dans
# /etc/ssh/sshd_config.d/10-diguee.conf : lu avant les autres fichiers du
# dossier (dont 50-cloud-init.conf), la première valeur l'emporte.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
AllowUsers @ADMIN@
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
# INFO : une ligne par connexion, avec l'adresse de l'administrateur
# (seules les adresses autorisées atteignent le port 22) ; conservée 14 jours.
LogLevel INFO
