# Journaux techniques conservés 14 jours au plus (spec §11, ticket #7) :
# fichiers d'un jour, supprimés quand leur dernière entrée a plus de 13 jours.
# journald est le seul dépôt (rsyslog est retiré par preparer-vps.sh).
[Journal]
Storage=persistent
Compress=yes
MaxFileSec=1day
MaxRetentionSec=13day
SystemMaxUse=1G
ForwardToSyslog=no
ForwardToWall=no
